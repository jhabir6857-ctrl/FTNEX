<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Onyx / Gunmetal -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1E2738" />
      <stop offset="60%" stop-color="#0F1520" />
      <stop offset="100%" stop-color="#07090D" />
    </radialGradient>

    <!-- Shield Chrome Rim Gradient -->
    <linearGradient id="shieldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#CBD5E1" />
      <stop offset="70%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Crimson Arrow Gradient -->
    <linearGradient id="crimsonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7F0D14" />
      <stop offset="35%" stop-color="#C91A25" />
      <stop offset="75%" stop-color="#E52D39" />
      <stop offset="100%" stop-color="#FF8A91" />
    </linearGradient>

    <!-- Monogram Titanium Gradient -->
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="80%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Shadow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#C91A25" flood-opacity="0.6" />
    </filter>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Rounded Tile Container for Crisp Presentation -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="#3A3F47" stroke-width="6" opacity="0.5" />

  <!-- Shield Base Contour -->
  <g filter="url(#dropShadow)">
    <path d="M 256 50 L 436 120 C 436 280 372 400 256 462 C 140 400 76 280 76 120 Z"
          fill="#101520"
          stroke="url(#shieldRim)"
          stroke-width="16"
          stroke-linejoin="round" />
    <path d="M 256 76 L 412 136 C 412 268 358 376 256 432 C 154 376 100 268 100 136 Z"
          fill="#080B10"
          stroke="#1E293B"
          stroke-width="4"
          stroke-linejoin="round" />
  </g>

  <!-- Stylized Aero Wings on Left -->
  <g fill="none" stroke="url(#titaniumGrad)" stroke-width="12" stroke-linecap="round" opacity="0.95">
    <path d="M 120 180 Q 170 192 216 204" />
    <path d="M 108 214 Q 164 222 220 228" />
    <path d="M 116 248 Q 172 250 224 250" />
  </g>

  <!-- High-Contrast Monogram "F" -->
  <path d="M 170 166 L 244 166 L 244 196 L 204 196 L 204 226 L 236 226 L 236 254 L 204 254 L 204 322 L 170 322 Z"
        fill="url(#titaniumGrad)"
        filter="url(#dropShadow)" />

  <!-- Dynamic Crimson Swoop & Ascending Arrow -->
  <g filter="url(#glow)">
    <path d="M 132 350 C 190 358 270 306 348 186 L 334 176 L 430 102 L 406 226 L 376 210 C 304 318 218 390 132 380 Z"
          fill="url(#crimsonGrad)" />
  </g>
</svg>
